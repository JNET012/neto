    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

              const { done, value } = await reader.read();
              if (done) break;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ansition: filter 0.3s;\">\n    <a class=\"nav-cta\" href=\"https://calendly.com/jhneto12/30min\" style=\"font-size: 14px; font-weight: 700; color: #f4f4f2; background: #141416; padding: 12px 24px; border-radius: 999px; white-space: nowrap; transition: background 0.25s, color 0.25s, transform 0.25s;\" style-hover=\"transform: translateY(-2px);\">Book a call →<\u002Fa>\n  <\u002Fheader>\n\n  <section id=\"s1\" data-screen-label=\"Scene 1 — The leak\" style=\"height: 320vh;\">\n    <div style=\"position: sticky; top: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n      <div style=\"text-align: center; padding: 0 32px; max-width: 1000px;\">\n        <div class=\"s1-intro\" style=\"font-size: 14px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b71; margin-bottom: 32px;\">Sound familiar? Keep scrolling.<\u002Fdiv>\n        <h1 style=\"font-weight: 300; font-size: clamp(40px, 6vw, 78px); line-height: 1.08; letter-spacing: -0.035em; margin: 0;\">\n          <span class=\"s1-line\" style=\"display: block;\">Every week, your business<\u002Fspan>\n          <span style=\"display: grid; grid-template-areas: 'w'; align-items: start;\">\n            <b class=\"s1-word\" style=\"grid-area: w; font-weight: 600;\">re-types the same orders.<\u002Fb>\n            <b class=\"s1-word\" style=\"grid-area: w; font-weight: 600; opacity: 0;\">misses calls it can't answer.<\u002Fb>\n            <b class=\"s1-word\" style=\"grid-area: w; font-weight: 600; opacity: 0;\">digs through inboxes for answers.<\u002Fb>\n            <b class=\"s1-word\" style=\"grid-area: w; font-weight: 600; opacity: 0;\">pays people to copy and paste.<\u002Fb>\n          <\u002Fspan>\n        <\u002Fh1>\n        <div class=\"s1-tally\" style=\"margin-top: 48px; font-weight: 300; font-size: clamp(22px, 2.4vw, 32px); letter-spacing: -0.02em; color: #6b6b71;\">It adds up. For our clients it added up to <b style=\"font-weight: 600; color: #141416;\">10,000+ hours<\u002Fb>.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ skipToContact }}\" class=\"s1-skip\" style=\"margin-top: 40px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; color: #6b6b71; background: none; border: 1px solid rgba(20,20,22,0.2); border-radius: 999px; padding: 12px 24px; cursor: pointer; transition: all 0.25s;\" style-hover=\"background: #141416; color: #f4f4f2; border-color: #141416;\">In a hurry? Skip the story, book the free call →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s2\" data-screen-label=\"Scene 2 — Disappear\" style=\"height: 320vh;\">\n    <div style=\"position: sticky; top: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n      <div class=\"s2-chips\" style=\"position: absolute; inset: 0;\">\n        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <span class=\"s2-chip\" style=\"position: absolute; left: {{ c.x }}; top: {{ c.y }}; background: #ffffff; border: 1px solid rgba(20,20,22,0.1); border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 500; white-space: nowrap; box-shadow: 0 10px 24px -16px rgba(20,20,22,0.4); transform: rotate({{ c.r }});\">{{ c.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"text-align: center; padding: 0 32px; position: relative;\">\n        <h2 class=\"s2-head\" style=\"font-weight: 300; font-size: clamp(40px, 6vw, 78px); line-height: 1.06; letter-spacing: -0.035em; margin: 0; max-width: 16ch; opacity: 0;\">We build AI and automation that make it <b style=\"font-weight: 600;\">disappear<\u002Fb>.<\u002Fh2>\n        <p class=\"s2-sub\" style=\"margin: 28px auto 0 auto; font-size: 19px; font-weight: 300; line-height: 1.55; color: #6b6b71; max-width: 44ch; opacity: 0;\">Honest AI and automation for small UK businesses. No hype, no vendor kickbacks — built properly, then handed over.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s2b\" data-screen-label=\"Scene 2b — The other side\" style=\"height: 550vh;\">\n    <div style=\"position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 0 32px;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b71; margin-bottom: 12px;\">Life on the other side<\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-bottom: 48px;\">\n        <sc-for list=\"{{ wins }}\" as=\"w\" hint-placeholder-count=\"5\">\n          <span class=\"s2b-dot\" style=\"width: 26px; height: 4px; border-radius: 2px; background: rgba(20,20,22,0.15);\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"position: relative; width: min(860px, 92vw); height: min(420px, 58vh);\">\n        <sc-for list=\"{{ wins }}\" as=\"w\" hint-placeholder-count=\"5\">\n          <div class=\"s2b-group\" style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center;\">\n            <h2 style=\"font-weight: 300; font-size: clamp(36px, 5vw, 68px); letter-spacing: -0.035em; line-height: 1.04; margin: 0 0 40px 0; max-width: 16ch;\">{{ w.titleA }} <b style=\"font-weight: 600;\">{{ w.titleB }}<\u002Fb><\u002Fh2>\n            <div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center;\">\n              <span class=\"s2b-item\" style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 400; color: #2c2c31; background: #ffffff; border: 1px solid rgba(20,20,22,0.08); border-radius: 999px; padding: 13px 28px; max-width: 90vw;\">{{ w.l1 }}<\u002Fspan>\n              <span class=\"s2b-item\" style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 400; color: #2c2c31; background: #ffffff; border: 1px solid rgba(20,20,22,0.08); border-rad margin-top: 16px; font-size: 15px; color: rgba(244,244,242,0.6);\">extra enquiries / month, one client<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"s4-note\" style=\"margin: 56px auto 0 auto; font-size: 17px; font-weight: 300; line-height: 1.6; color: rgba(244,244,242,0.65); max-width: 48ch; opacity: 0;\">Real numbers from three small UK businesses — an e-commerce group, a garage, a field services firm. Ask us how on the call.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s4b\" data-screen-label=\"Scene 4b — Case studies\" style=\"height: 400vh; background: #141416;\">\n    <div style=\"position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 0 32px;\">\n      <div style=\"text-align: center; margin-bottom: 36px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,244,242,0.55);\">The stories behind the numbers<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"s4b-stage\" style=\"position: relative; width: min(880px, 92vw); height: min(440px, 62vh);\">\n        <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <a href=\"{{ c.href }}\" class=\"s4b-card\" style=\"position: absolute; inset: 0; background: #f4f4f2; color: #141416; border-radius: 24px; padding: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.3fr); gap: 40px; align-items: center; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);\" style-hover=\"color: #141416;\">\n            <div>\n              <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6b71; margin-bottom: 28px;\">{{ c.idx }} · {{ c.sector }}<\u002Fdiv>\n              <div style=\"font-weight: 300; font-size: clamp(52px, 6vw, 84px); letter-spacing: -0.04em; line-height: 0.95; white-space: nowrap;\">{{ c.stat }}<\u002Fdiv>\n              <div style=\"margin-top: 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6b71;\">{{ c.statLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <h3 style=\"font-size: clamp(20px, 2.2vw, 26px); font-weight: 500; letter-spacing: -0.015em; margin: 0 0 12px 0;\">{{ c.title }}<\u002Fh3>\n              <p style=\"margin: 0 0 24px 0; font-size: 16px; line-height: 1.6; color: #6b6b71;\">{{ c.body }}<\u002Fp>\n              <span style=\"font-size: 15px; font-weight: 700; border-bottom: 1.5px solid #141416; padding-bottom: 2px;\">Read the case study →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top: 36px; font-size: 14px; color: rgba(244,244,242,0.5);\">Keep scrolling — 3 of them<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s5\" data-screen-label=\"Scene 5 — How\" style=\"padding: 140px 32px; background: #ffffff;\">\n    <div style=\"max-width: 1100px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 72px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b71; margin-bottom: 14px;\">And the catch?<\u002Fdiv>\n        <h2 style=\"font-weight: 300; font-size: clamp(32px, 4.4vw, 56px); letter-spacing: -0.03em; line-height: 1.06; margin: 0 auto; max-width: 20ch;\">There isn't one. Here's the whole deal.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 0;\">\n        <sc-for list=\"{{ deal }}\" as=\"d\" hint-placeholder-count=\"4\">\n          <div class=\"s5-row\" style=\"display: grid; grid-template-columns: 80px minmax(0,1fr); gap: 32px; align-items: baseline; padding: 34px 0; border-top: 1px solid rgba(20,20,22,0.1);\">\n            <span style=\"font-weight: 300; font-size: 40px; letter-spacing: -0.03em; color: rgba(20,20,22,0.25);\">{{ d.num }}<\u002Fspan>\n            <div>\n              <h3 style=\"font-size: 23px; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 8px 0;\">{{ d.title }}<\u002Fh3>\n              <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #6b6b71; max-width: 66ch;\">{{ d.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s5b\" data-screen-label=\"Scene 5b — About\" style=\"padding: 140px 32px;\">\n    <div class=\"s5b-inner resp-1col\" style=\"max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 5fr 7fr; gap: 64px; align-items: center;\">\n      <div class=\"headshot-wrap\" style=\"aspect-ratio: 4/5; max-width: 400px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(20,20,22,0.08);\">\n        <img src=\"1b6dde6d-d02e-4be9-bc05-e6d88b79486b\" alt=\"James Hodgkinson, founder of Neto\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b71; margin-bottom: 22px;\">Who you'd be talking to<\u002Fdiv>\n        <h2 style=\"font-weight: 300; font-size: clamp(32px, 4.4vw, 53px); letter-spacing: -0.03em; line-height: 1.06; margin: 0 0 26px 0; max-width: 16ch;\">A senior technologist, on every project.<\u002Fh2>\n        <p style=\"margin: 0 0 16px 0; font-size: 18px; line-height: 1.62; color: #2c2c31;\">Neto is <b style=\"font-weight: 600;\">James Hodgkinson<\u002Fb>. After more than ten years building software and automation, I started Neto to give small UK businesses the kind of senior, independent help that's usually reserved for big budgets.<\u002Fp>\n        <p style=\"margin: 0 0 28px 0; font-size: 18px; line-height: 1.62; color: #2c2c31;\">When you work with Neto, you work directly with me — not a sales team, and never a junior. I'll tell you honestly what's worth doing, build it for a fixed price, and hand it over so you're never dependent on me.<\u002Fp>\n        <div style=\"display: flex; align-items: center; gap: 20px; flex-wrap: wrap;\">\n          <span style=\"font-size: 14px; font-weight: 600;\">James Hodgkinson · Founder, Neto<\u002Fspan>\n          <a href=\"https://www.linkedin.com/in/james-hodgkinson-738832a0/\" style=\"font-size: 14px; font-weight: 600; border-bottom: 1.5px solid rgba(20,20,22,0.3); padding-bottom: 2px;\">Connect on LinkedIn<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s6\" data-screen-label=\"Scene 6 — Contact\" style=\"min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 32px;\">\n    <div style=\"text-align: center; max-width: 900px;\">\n      <h2 class=\"s6-head\" style=\"font-weight: 300; font-size: clamp(40px, 6vw, 84px); letter-spacing: -0.035em; line-height: 1.04; margin: 0;\">The only question left: what would <b style=\"font-weight: 600;\">your<\u002Fb> numbers look like?<\u002Fh2>\n      <p style=\"margin: 32px auto 48px auto; font-size: 19px; font-weight: 300; line-height: 1.55; color: #6b6b71; max-width: 46ch;\">That takes one free 30-minute call with James, the founder. No pitch, no juniors, no obligation — and if we can't help, we'll say so on the spot.<\u002Fp>\n      <div style=\"display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;\">\n        <a href=\"https://calendly.com/jhneto12/30min\" style=\"font-size: 17px; font-weight: 700; color: #f4f4f2; background: #141416; padding: 19px 40px; border-radius: 999px; white-space: nowrap; box-shadow: 0 16px 34px -14px rgba(20,20,22,0.5); transition: background 0.25s, transform 0.25s;\" style-hover=\"background: #2c2c31; color: #f4f4f2; transform: translateY(-2px);\">Find out — book the free call →<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin: 32px 0 0 0; font-size: 15px; color: #6b6b71;\">Or right now: <a href=\"tel:+447414556969\" style=\"font-weight: 600; border-bottom: 1.5px solid rgba(20,20,22,0.3);\">07414 556969<\u002Fa> · <a href=\"mailto:hello@netolabs.co.uk\" style=\"font-weight: 600; border-bottom: 1.5px solid rgba(20,20,22,0.3);\">hello@netolabs.co.uk<\u002Fa><\u002Fp>\n      <p style=\"margin: 72px 0 0 0; font-size: 13px; color: #9a9a97;\">Neto Labs Automation Ltd · Registered in England &amp; Wales · © 2026 · <a href=\"https://netolabs.co.uk/privacy.html\" style=\"color: #9a9a97;\">Privacy<\u002Fa> · <a href=\"https://www.linkedin.com/in/james-hodgkinson-738832a0/\" style=\"color: #9a9a97;\">LinkedIn<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  jumpTo(id) {\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop + 10, behavior: 'smooth' });\n  }\n  componentDidMount() {\n    const wait = () => {\n      if (window.gsap && window.ScrollTrigger) this.initGsap();\n      else setTimeout(wait, 100);\n    };\n    wait();\n  }\n  componentWillUnmount() {\n    if (this._onProgress) window.removeEventListener('scroll', this._onProgress);\n  }\n  initGsap() {\n    if (this._gsapInit) return;\n    this._gsapInit = true;\n    const gsap = window.gsap;\n    gsap.registerPlugin(window.ScrollTrigger);\n    const progressEl = document.getElementById('progressbar');\n    this._onProgress = () => {\n      const h = document.documentElement, max = h.scrollHeight - h.clientHeight;\n      if (progressEl) progressEl.style.transform = 'scaleX(' + (max > 0 ? window.scrollY / max : 0) + ')';\n    };\n    window.addEventListener('scroll', this._onProgress, { passive: true });\n    this._onProgress();\n    // Invert the nav over the dark scenes so the logo stays visible\n    const logoEl = document.querySelector('.nav-logo');\n    const ctaEl = document.querySelector('.nav-cta');\n    const setNav = (dark) => {\n      if (logoEl) logoEl.style.filter = dark ? 'invert(1)' : 'none';\n      if (ctaEl) { ctaEl.style.background = dark ? '#f4f4f2' : '#141416'; ctaEl.style.color = dark ? '#141416' : '#f4f4f2'; }\n      if (progressEl) progressEl.style.background = dark ? '#f4f4f2' : '#141416';\n    };\n    ['#s4', '#s4b'].forEach((sel) => {\n      window.ScrollTrigger.create({\n        trigger: sel, start: 'top 60px', end: 'bottom 60px',\n        onToggle: (self) => setNav(self.isActive)\n      });\n    });\n    // S1: cycle the pain words, then tally\n    const words = gsap.utils.toArray('.s1-word');\n    gsap.from(['.s1-line', words[0]], { opacity: 0, y: 26, duration: 0.9, ease: 'power2.out', stagger: 0.15 });\n    const tl1 = gsap.timeline({ scrollTrigger: { trigger: '#s1', start: 'top top', end: 'bottom bottom', scrub: 0.5 } });\n    words.forEach((w, i) => {\n      if (i > 0) tl1.fromTo(w, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 1 }, '>0.6');\n      if (i < words.length - 1) tl1.to(w, { opacity: 0, y: -26, duration: 1 }, '>1.2');\n    });\n    tl1.fromTo('.s1-tally', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.4 }, '>0.4');\n    tl1.to('.s1-intro', { opacity: 0, duration: 0.8 }, 1);\n    // S2: chips swarm in, then scatter away as the promise lands\n    const chips = gsap.utils.toArray('.s2-chip');\n    const tl2 = gsap.timeline({ scrollTrigger: { trigger: '#s2', start: 'top top', end: 'bottom bottom', scrub: 0.5 } });\n    tl2.from(chips, { opacity: 0, scale: 0.6, y: 60, stagger: 0.25, duration: 1.2 });\n    tl2.to(chips, { opacity: 0, scale: 0.4, y: -140, rotate: () => gsap.utils.random(-40, 40), stagger: 0.12, duration: 1.4 }, '>1');\n    tl2.fromTo('.s2-head', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.6 }, '<0.5');\n    tl2.fromTo('.s2-sub', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2 }, '>0.2');\n    // S2b: positive outcomes cycle\n    const groups = gsap.utils.toArray('.s2b-group');\n    const dots = gsap.utils.toArray('.s2b-dot');\n    gsap.set(groups.slice(1), { opacity: 0 });\n    const tl2b = gsap.timeline({ scrollTrigger: { trigger: '#s2b', start: 'top top', end: 'bottom bottom', scrub: 0.5 } });\n    groups.forEach((g, i) => {\n      const items = g.querySelectorAll('.s2b-item');\n      if (i === 0) {\n        tl2b.from(g.querySelector('h2'), { opacity: 0, y: 34, duration: 1 });\n        tl2b.from(items, { opacity: 0, y: 24, stagger: 0.4, duration: 0.8 }, '>0.2');\n      } else {\n        tl2b.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.01 }, '>0.8');\n        tl2b.from(g.querySelector('h2'), { opacity: 0, y: 34, duration: 1 }, '<');\n        tl2b.from(items, { opacity: 0, y: 24, stagger: 0.4, duration: 0.8 }, '>0.2');\n      }\n      tl2b.to(dots[i], { background: '#141416', duration: 0.3 }, '<-0.5');\n      tl2b.to({}, { duration: 1.4 });\n      if (i < groups.length - 1) {\n        tl2b.to(g, { opacity: 0, y: -30, duration: 0.8 });\n        tl2b.to(dots[i], { background: 'rgba(20,20,22,0.15)', duration: 0.3 }, '<');\n      }\n    });\n    // S3: horizontal card track\n    const track = document.querySelector('.s3-track');\n    gsap.to(track, {\n      x: () => -(track.scrollWidth - window.innerWidth + 96), ease: 'none',\n      scrollTrigger: { trigger: '#s3', start: 'top top', end: 'bottom bottom', scrub: 0.4, invalidateOnRefresh: true },\n    });\n    // S4: counters scrub up\n    const counts = [['.n-saved', 250], ['.n-hours', 10000], ['.n-enq', 200]];\n    const tl4 = gsap.timeline({ scrollTrigger: { trigger: '#s4', start: 'top top', end: 'bottom bottom', scrub: 0.5 } });\n    counts.forEach(([sel, target]) => {\n      const el = document.querySelector(sel), o = { v: 0 };\n      tl4.to(o, { v: target, duration: 3, ease: 'none', onUpdate: () => { el.textContent = Math.round(o.v).toLocaleString('en-GB'); } }, 0);\n    });\n    tl4.fromTo('.s4-note', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.5 }, '>0.3');\n    // S4b: case-study cards stack on top of each other\n    const cards = gsap.utils.toArray('.s4b-card');\n    const tl4b = gsap.timeline({ scrollTrigger: { trigger: '#s4b', start: 'top top', end: 'bottom bottom', scrub: 0.5 } });\n    cards.forEach((card, i) => {\n      if (i === 0) { tl4b.from(card, { y: '60vh', opacity: 0, duration: 1.2 }); }\n      else {\n        tl4b.from(card, { y: '110vh', rotate: i % 2 ? 4 : -4, duration: 1.6 }, '>0.7');\n        tl4b.to(cards[i - 1], { scale: 0.93, y: -22, opacity: 0.55, duration: 1.6 }, '<');\n      }\n    });\n    tl4b.to({}, { duration: 1 });\n    // S5 rows + S6 headline reveal on entry\n    gsap.utils.toArray('.s5-row').forEach(row => {\n      gsap.from(row, { opacity: 0, y: 34, duration: 0.7, ease: 'power2.out', scrollTrigger: { trigger: row, start: 'top 85%' } });\n    });\n    gsap.from('.s5b-inner', { opacity: 0, y: 40, duration: 0.9, ease: 'power2.out', scrollTrigger: { trigger: '#s5b', start: 'top 75%' } });\n    gsap.from('.s6-head', { opacity: 0, y: 40, duration: 0.9, ease: 'power2.out', scrollTrigger: { trigger: '#s6', start: 'top 70%' } });\n  }\n  renderVals() {\n    return {\n      skipToContact: () => this.jumpTo('s6'),\n\n      wins: [\n        { titleA: 'Speed as a', titleB: 'weapon.', l1: 'Quotes back the same day', l2: 'Every enquiry answered in minutes, not days', l3: 'Deposits taken the moment they say yes' },\n        { titleA: 'Never dropping', titleB: 'anything.', l1: 'Every lead followed up, every time', l2: 'No enquiry left behind after 5pm', l3: 'Reviews requested after every job, automatically' },\n        { titleA: 'Capacity without', titleB: 'headcount.', l1: 'Take on more work with the same team', l2: 'Grow revenue without growing overheads', l3: 'Your best person doing their best work, not admin' },\n        { titleA: 'Knowing your', titleB: 'numbers.', l1: 'Answers about the business in seconds', l2: 'Spotting the profitable jobs from the duds', l3: 'Seeing tomorrow coming' },\n        { titleA: 'Customer experience that', titleB: 'sells for you.', l1: 'Customers updated without anyone remembering to', l2: 'The follow-up that wins the second sale', l3: 'Answering at 11pm without being awake' },\n      ],\n      cases: [\n        { idx: '01', href: 'https://netolabs.co.uk/case-nkgroup.html', sector: 'E-commerce & retail', stat: '24/7', statLabel: 'Support across 3 Shopify brands', title: 'AI customer service assistant', body: \"One assistant answering order, delivery and returns questions across all three of NK Group's Shopify stores — on web chat and phone.\" },\n        { idx: '02', href: 'https://netolabs.co.uk/case-autobliss.html', sector: 'Automotive services', stat: '+200', statLabel: 'Extra enquiries / month', title: 'AI voice agent for customer enquiries', body: \"A bespoke voice agent answering Autobliss's calls 24/7 — capturing bookings and enquiries that were previously lost to missed calls.\" },\n        { idx: '03', href: 'https://netolabs.co.uk/case-fieldservices.html', sector: 'Field services', stat: '520 hrs', statLabel: 'Manual admin removed / year', title: 'Eliminating manual admin', body: 'Turning on-site paper job sheets and WhatsApp photos into instant, searchable digital records for a growing field services team.' },\n      ],\n      chips: [\n        { label: 'Re-typing orders into the CRM', x: '8%', y: '16%', r: '-6deg' },\n        { label: 'Chasing unpaid invoices', x: '64%', y: '12%', r: '4deg' },\n        { label: 'Missed calls after 5pm', x: '74%', y: '38%', r: '-3deg' },\n        { label: '\"Where\\u2019s my order?\" emails', x: '6%', y: '44%', r: '5deg' },\n        { label: 'Copying WhatsApp photos to files', x: '58%', y: '78%', r: '-5deg' },\n        { label: 'Paper job sheets', x: '14%', y: '74%', r: '3deg' },\n        { label: 'Updating three spreadsheets', x: '38%', y: '8%', r: '-2deg' },\n        { label: 'Booking confirmations by hand', x: '30%', y: '84%', r: '6deg' },\n        { label: 'Answering the same question again', x: '82%', y: '62%', r: '2deg' },\n        { label: 'Monday-morning admin pile', x: '4%', y: '60%', r: '-4deg' },\n      ],\n      services: [\n        { num: '01', title: 'AI & Automation Review', body: \"A clear, practical plan for where AI and automation will actually help your business — focused on real wins, not hype or a vendor's sales pitch.\" },\n        { num: '02', title: 'Workflow Automation', body: 'Connecting the tools you already use — email, spreadsheets, your CRM — so information moves between them automatically, without re-typing or the errors that creep in.' },\n        { num: '03', title: 'AI assistants', body: 'AI assistants trained on your own information, so your team — or your customers — get instant, accurate answers instead of digging through files.' },\n        { num: '04', title: 'Getting your data in order', body: \"Tidying up where your information lives so it's actually usable — and ready for whatever you want to build next.\" },\n        { num: '05', title: 'Scaling Operations', body: 'Putting systems in place that let your business grow revenue without a matching rise in headcount or overhead — so more of each sale stays profit.' },\n      ],\n      deal: [\n        { num: '01', title: 'A free 30-minute discovery call', body: \"You talk, we listen, and we do the honest maths on your bottlenecks live. If we can't help, we'll tell you straight away and point you in the right direction.\" },\n        { num: '02', title: 'One fixed price, in writing', body: \"No hourly rates, no scope creep. If it takes us longer than we thought, that's our problem — not yours.\" },\n        { num: '03', title: 'Senior delivery, never a junior', body: \"Every project is built by James, the founder — a senior technologist with 10+ years' experience. No sales team, no hand-offs.\" },\n        { num: '04', title: 'Built, trained, handed over', body: \"We deploy, train your team, and leave you independent. No commissions, no lock-in, no ongoing dependency on us.\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
