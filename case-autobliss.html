document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <a href=\"https://netolabs.co.uk/index.html#work\" class=\"cs-reveal\" style=\"font-size: 14px; font-weight: 600; color: #6b6b71; display: inline-flex; align-items: center; gap: 8px;\" style-hover=\"color: #141416;\">← Back to the story<\u002Fa>\n      <div class=\"cs-reveal\" style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b71; margin: 36px 0 24px 0;\">Case study · Automotive services<\u002Fdiv>\n      <h1 class=\"cs-reveal\" style=\"font-weight: 300; font-size: clamp(38px, 5.4vw, 72px); line-height: 1.03; letter-spacing: -0.035em; margin: 0 0 24px 0; max-width: 18ch;\">An AI voice agent that answers <b style=\"font-weight: 600;\">every call<\u002Fb>, day or night.<\u002Fh1>\n      <p class=\"cs-reveal\" style=\"margin: 0; font-size: clamp(17px, 1.8vw, 21px); font-weight: 300; line-height: 1.55; color: #6b6b71; max-width: 54ch;\">How Autobliss, an independent automotive garage, stopped losing customers to missed calls — capturing roughly 200 extra enquiries a month with no added staffing.<\u002Fp>\n      <div class=\"cs-reveal\" style=\"display: flex; flex-wrap: wrap; gap: 24px 44px; margin-top: 40px; padding-top: 28px; border-top: 1px solid rgba(20,20,22,0.08);\">\n        <sc-for list=\"{{ meta }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div>\n            <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6b71; margin-bottom: 6px;\">{{ m.k }}<\u002Fdiv>\n            <div style=\"font-size: 16px; font-weight: 500;\">{{ m.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Stats\" style=\"padding: 0 32px 72px 32px;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div class=\"cs-stat\" style=\"background: #ffffff; border: 1px solid rgba(20,20,22,0.055); border-radius: 18px; padding: 28px 26px;\">\n          <div style=\"font-weight: 300; font-size: clamp(30px, 3vw, 44px); letter-spacing: -0.03em; line-height: 1; white-space: nowrap;\"><span class=\"cs-num\" data-count=\"{{ s.count }}\" data-prefix=\"{{ s.prefix }}\" data-suffix=\"{{ s.suffix }}\">{{ s.display }}<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 14px; color: #6b6b71;\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-for list=\"{{ chapters }}\" as=\"ch\" hint-placeholder-count=\"5\">\n    <section data-screen-label=\"Chapter\" style=\"background: {{ ch.bg }};\">\n      <div class=\"cs-chapter\" style=\"max-width: 1100px; margin: 0 auto; padding: 88px 32px; display: grid; grid-template-columns: 4fr 8fr; gap: 52px;\">\n        <div>\n          <div style=\"position: sticky; top: 110px;\">\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b71; margin-bottom: 16px;\">Chapter {{ ch.num }}<\u002Fdiv>\n            <h2 style=\"font-weight: 300; font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -0.03em; line-height: 1.08; margin: 0;\">{{ ch.title }}<\u002Fh2>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <sc-if value=\"{{ ch.intro }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 0; font-size: clamp(19px, 2vw, 25px); font-weight: 300; line-height: 1.42; letter-spacing: -0.01em; color: #141416;\">{{ ch.intro }}<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ ch.paras }}\" as=\"p\">\n            <p style=\"margin: 0; font-size: 17px; line-height: 1.62; color: #2c2c31;\">{{ p }}<\u002Fp>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ ch.hasList }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 6px;\">\n              <sc-for list=\"{{ ch.list }}\" as=\"li\">\n                <div style=\"display: flex; gap: 14px; align-items: baseline; font-size: 16px; line-height: 1.55; color: #2c2c31;\"><span style=\"width: 8px; height: 8px; border-radius: 3px; background: #141416; flex: none; transform: translateY(-2px);\"><\u002Fspan>{{ li }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ ch.paras2 }}\" as=\"p2\">\n            <p style=\"margin: 0; font-size: 17px; line-height: 1.62; color: #2c2c31;\">{{ p2 }}<\u002Fp>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ ch.hasList2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 6px;\">\n              <sc-for list=\"{{ ch.list2 }}\" as=\"li2\">\n                <div style=\"display: flex; gap: 14px; align-items: baseline; font-size: 16px; line-height: 1.55; color: #2c2c31;\"><span style=\"width: 8px; height: 8px; border-radius: 3px; background: #141416; flex: none; transform: translateY(-2px);\"><\u002Fspan>{{ li2 }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ ch.paras3 }}\" as=\"p3\">\n            <p style=\"margin: 0; font-size: 17px; line-height: 1.62; color: #2c2c31;\">{{ p3 }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n\n  <section data-screen-label=\"Takeaway\" style=\"padding: 110px 32px;\">\n    <div class=\"cs-takeaway\" style=\"max-width: 880px; margin: 0 auto; text-align: center;\">\n      <div style=\"width: 44px; height: 44px; border-radius: 13px; background: #141416; color: #f4f4f2; display: flex; align-items: center; justify-content: center; font-size: 16px; margin: 0 auto 28px auto;\">★<\u002Fdiv>\n      <p style=\"margin: 0; font-weight: 300; font-size: clamp(24px, 3.2vw, 38px); line-height: 1.3; letter-spacing: -0.02em;\">Most businesses don't need to automate every interaction. The real opportunity is spotting the <b style=\"font-weight: 600;\">repetitive enquiries<\u002Fb> that drain staff time — and making sure those customers get an <b style=\"font-weight: 600;\">immediate response<\u002Fb>.<\u002Fp>\n      <p style=\"margin: 28px auto 0 auto; font-size: 17px; line-height: 1.6; color: #6b6b71; max-width: 60ch;\">For Autobliss, the value wasn't replacing people. It was ensuring every call was answered, every opportunity was captured, and the team could focus on great service instead of constantly managing the phone.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"CTA\" style=\"padding: 0 32px clamp(64px, 9vw, 110px) 32px;\">\n    <div class=\"cs-cta\" style=\"max-width: 1100px; margin: 0 auto; background: #141416; color: #f4f4f2; border-radius: 28px; padding: clamp(52px, 8vw, 96px) 48px; text-align: center; position: relative; overflow: hidden;\">\n      <div style=\"position: absolute; left: 50%; top: -30%; transform: translateX(-50%); width: min(760px, 90%); height: 480px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.14), transparent 70%); pointer-events: none;\"><\u002Fdiv>\n      <div style=\"position: relative;\">\n        <h2 style=\"font-weight: 300; font-size: clamp(30px, 4.2vw, 50px); letter-spacing: -0.03em; line-height: 1.08; margin: 0 auto; max-width: 22ch; color: #f4f4f2; text-wrap: balance;\">Could a voice agent capture the calls <b style=\"font-weight: 600;\">you're<\u002Fb> missing?<\u002Fh2>\n        <p style=\"margin: 22px auto 36px auto; font-size: 18px; font-weight: 300; line-height: 1.55; color: rgba(244,244,242,0.72); max-width: 46ch;\">Book a no-obligation 30-minute call and we'll tell you honestly whether it's worth doing for your business.<\u002Fp>\n        <a href=\"https://calendly.com/jhneto12/30min\" style=\"display: inline-block; font-size: 16px; font-weight: 700; color: #141416; background: #f4f4f2; padding: 17px 34px; border-radius: 999px; white-space: nowrap; transition: background 0.25s, transform 0.25s;\" style-hover=\"background: #ffffff; color: #141416; transform: translateY(-2px);\">Book a discovery call →<\u002Fa>\n        <p style=\"margin: 28px 0 0 0; font-size: 15px; color: rgba(244,244,242,0.6);\">Or call <a href=\"tel:+447414556969\" style=\"color: #f4f4f2; border-bottom: 1px solid rgba(244,244,242,0.4);\">07414 556969<\u002Fa> · <a href=\"mailto:hello@netolabs.co.uk\" style=\"color: #f4f4f2; border-bottom: 1px solid rgba(244,244,242,0.4);\">hello@netolabs.co.uk<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer data-screen-label=\"Footer\" style=\"background: #141416; color: #f4f4f2;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; padding: 48px 32px 42px 32px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap;\">\n      <div>\n        <img src=\"b253f178-8cda-428d-b40c-65a1efd91284\" alt=\"Neto\" style=\"height: 24px; display: block; margin-bottom: 14px;\">\n        <div style=\"font-size: 13px; color: rgba(244,244,242,0.55);\">Honest AI &amp; automation · United Kingdom · © 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 28px; font-size: 14px; font-weight: 500;\">\n        <a href=\"https://netolabs.co.uk/index.html#work\" style=\"color: rgba(244,244,242,0.72);\">Case studies<\u002Fa>\n        <a href=\"https://netolabs.co.uk/index.html#contact\" style=\"color: rgba(244,244,242,0.72);\">Contact<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const wait = () => { (window.gsap && window.ScrollTrigger) ? this.initGsap() : setTimeout(wait, 100); };\n    wait();\n  }\n  componentWillUnmount() {\n    if (this._onProgress) window.removeEventListener('scroll', this._onProgress);\n  }\n  initGsap() {\n    if (this._gsapInit) return;\n    this._gsapInit = true;\n    const gsap = window.gsap;\n    gsap.registerPlugin(window.ScrollTrigger);\n    const progressEl = document.getElementById('progressbar');\n    this._onProgress = () => {\n      const h = document.documentElement, max = h.scrollHeight - h.clientHeight;\n      if (progressEl) progressEl.style.transform = 'scaleX(' + (max > 0 ? window.scrollY / max : 0) + ')';\n    };\n    window.addEventListener('scroll', this._onProgress, { passive: true });\n    this._onProgress();\n    gsap.from('.cs-reveal', { opacity: 0, y: 26, duration: 0.8, ease: 'power2.out', stagger: 0.12 });\n    gsap.utils.toArray('.cs-stat').forEach((card, i) => {\n      gsap.from(card, { opacity: 0, y: 28, duration: 0.6, delay: i * 0.08, ease: 'power2.out', scrollTrigger: { trigger: card, start: 'top 90%' } });\n      const num = card.querySelector('.cs-num');\n      const target = parseFloat(num.dataset.count);\n      if (!isNaN(target)) {\n        const pre = num.dataset.prefix || '', suf = num.dataset.suffix || '', o = { v: 0 };\n        gsap.to(o, { v: target, duration: 1.1, ease: 'power2.out', scrollTrigger: { trigger: card, start: 'top 85%' },\n          onUpdate: () => { num.textContent = pre + Math.round(o.v) + suf; } });\n      }\n    });\n    gsap.utils.toArray('.cs-chapter, .cs-takeaway, .cs-cta').forEach(el => {\n      gsap.from(el, { opacity: 0, y: 34, duration: 0.8, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 82%' } });\n    });\n  }\n  renderVals() {\n    return {\n      meta: [\n        { k: 'Client', v: 'Autobliss' },\n        { k: 'Sector', v: 'Automotive service & repair' },\n        { k: 'Engagement', v: 'AI voice agent & automation' },\n      ],\n      stats: [\n        { count: '200', prefix: '+', suffix: '', display: '+200', label: 'Extra enquiries captured / month' },\n        { count: '', prefix: '', suffix: '', display: '24/7', label: 'Call answering, every day' },\n        { count: '', prefix: '', suffix: '', display: '£0', label: 'Added staffing cost' },\n        { count: '100', prefix: '', suffix: '%', display: '100%', label: 'Calls logged & transcribed' },\n      ],\n      chapters: [\n        { num: '01', title: 'The client', bg: '#ffffff',\n          intro: 'Autobliss is an independent automotive service and repair business that handles a high volume of inbound customer enquiries by phone.',\n          paras: ['Bookings, quotations, availability checks and job updates all come through the same channel — the telephone — which made the phone both the lifeblood of the business and its biggest bottleneck.'],\n          hasList: false, list: [], paras2: [], hasList2: false, list2: [], paras3: [] },\n        { num: '02', title: 'The challenge', bg: '#f4f4f2',\n          intro: '',\n          paras: [\"Like many busy garages, Autobliss relied heavily on telephone enquiries. The problem wasn't a lack of demand — it was the team's ability to answer every call.\", 'Technicians were often working on vehicles and reception was busy with customers already on site. During peak periods, incoming calls frequently went unanswered, and many callers simply moved on to another garage rather than leave a voicemail or wait for a callback. A significant number of potential customers were being lost each month to missed calls and delayed responses.', 'The team was also spending valuable time answering the same routine questions over and over:'],\n          hasList: true, list: ['Opening hours', 'MOT and service availability', 'Typical pricing enquiries', 'Booking requests', 'Vehicle collection and drop-off information', 'Updates on existing jobs'],\n          paras2: ['These interruptions reduced productivity and pulled staff away from higher-value customer interactions.'],\n          hasList2: false, list2: [], paras3: [] },\n        { num: '03', title: 'Our approach', bg: '#ffffff',\n          intro: \"We implemented a bespoke AI-powered voice agent designed specifically around Autobliss's customer journey.\",\n          paras: [\"Rather than deploying a generic chatbot with a voice interface, the system was trained on the garage's own information, services, pricing structure and common customer enquiries. The agent was configured to:\"],\n          hasList: true, list: ['Answer calls instantly, 24 hours a day', 'Handle routine customer enquiries conversationally', 'Capture booking requests and customer details', 'Provide information about services and availability', 'Record detailed messages when human intervention was required', 'Escalate complex enquiries to the team when appropriate'],\n          paras2: ['Every call is automatically logged and transcribed, giving complete visibility of customer interactions and ensuring no enquiry is lost.'],\n          hasList2: false, list2: [], paras3: [] },\n        { num: '04', title: 'Results', bg: '#f4f4f2',\n          intro: 'The impact was immediate.',\n          paras: ['The AI voice agent now captures and handles enquiries that would previously have been missed when staff were unavailable. Key outcomes included:'],\n          hasList: true, list: ['Approximately 200 additional customer enquiries captured each month', 'A significant reduction in missed-call losses', '24/7 call answering with no additional staffing costs', 'Fewer interruptions for technicians and office staff', 'Faster response times for prospective customers', 'Complete visibility of conversations through transcripts and reporting'],\n          paras2: ['Most importantly, the business retained revenue opportunities that would previously have been lost the moment a call went unanswered.'],\n          hasList2: false, list2: [], paras3: [] },\n        { num: '05', title: 'Future opportunities', bg: '#ffffff',\n          intro: '',\n          paras: ['With call handling automated, the platform can be expanded to:'],\n          hasList: true, list: ['Book appointments directly into scheduling systems', 'Send automated appointment reminders', 'Trigger customer follow-up workflows', 'Generate management reports on enquiry trends', 'Integrate with CRM and garage management software'],\n          paras2: [], hasList2: false, list2: [], paras3: [] },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
